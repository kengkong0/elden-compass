<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>艾尔登法环·褪色者探索罗盘</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- 顶部双层黑金视觉架构 -->
  <header class="app-header">
    <!-- 第一层：窗口管理与控制栏 (拖拽区) -->
    <div class="win-titlebar">
      <div class="drag-handle pywebview-drag-region" id="dragHandle" title="按住拖动窗口">
        <!-- 黄金律法符文 SVG 徽标 -->
        <svg class="rune-icon" viewBox="0 0 24 24" width="16" height="16">
          <circle cx="12" cy="12" r="9" fill="none" stroke="#d4af37" stroke-width="1.8"/>
          <circle cx="12" cy="12" r="5" fill="none" stroke="#f5d76e" stroke-width="1.4"/>
          <line x1="12" y1="1" x2="12" y2="23" stroke="#f5d76e" stroke-width="1.4"/>
          <line x1="1" y1="12" x2="23" y2="12" stroke="#f5d76e" stroke-width="1.4"/>
        </svg>
        <span class="win-title">法环探索罗盘</span>
        <span class="curr-chapter-pill" id="headerChapterPill">P21 风暴关卡</span>
      </div>

      <!-- 右侧控制区 (禁止拖拽) -->
      <div class="win-controls">
        <!-- 透明度胶囊滑块 -->
        <div class="control-pill opacity-pill" title="窗口不透明度 (拖动调节，微透防挡)">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <input type="range" class="opacity-range" id="opacitySlider" min="25" max="100" value="90">
          <span class="pill-label" id="opacityVal">90%</span>
        </div>

        <!-- 鼠标穿透开关 -->
        <button class="win-btn" id="clickthroughBtn" title="鼠标穿透模式 (Alt+Q): 开启后点击直接操作游戏，完全防误触">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/>
            <path d="M13 13l6 6"/>
          </svg>
          <span class="btn-text">穿透</span>
        </button>

        <!-- 迷你 HUD 模式切换 -->
        <button class="win-btn icon-only" id="miniBtn" title="切换迷你精简模式">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <rect x="9" y="9" width="12" height="12" rx="1"/>
          </svg>
        </button>

        <!-- 最小化与关闭 -->
        <button class="win-btn icon-only" id="minBtn" title="最小化到任务栏/托盘">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor">
            <rect x="4" y="11" width="16" height="2"/>
          </svg>
        </button>
        <button class="win-btn icon-only close-btn" id="closeBtn" title="退出程序">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- 第二层：主功能导航栏 (严格防折叠排版) -->
    <nav class="nav-strip">
      <button class="nav-tab active" data-tab="guide">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
        </svg>
        <span>图文指引</span>
      </button>

      <button class="nav-tab" data-tab="checklist">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
        </svg>
        <span>全收集防断</span>
      </button>

      <button class="nav-tab" data-tab="map">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          <line x1="8" y1="2" x2="8" y2="18"/>
          <line x1="16" y1="6" x2="16" y2="22"/>
        </svg>
        <span>互动地图</span>
      </button>

      <button class="nav-tab" data-tab="tips">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="12 8 8 12 12 16 16 12 12 8"/>
        </svg>
        <span>开荒避坑</span>
      </button>
    </nav>
  </header>

  <!-- 主体视图区域 -->
  <main class="app-main">
    
    <!-- TAB 1: 游民图文指引 (全宽无遮挡阅读区 + 抽屉目录) -->
    <section class="tab-pane active" id="guidePane">
      
      <!-- 悬浮抽屉目录层 (点击展开，不挤压正文宽度) -->
      <div class="drawer-scrim" id="drawerScrim"></div>
      <aside class="drawer-sidebar" id="drawerSidebar">
        <div class="drawer-header">
          <span class="drawer-title">📜 199 篇章节索引</span>
          <button class="drawer-close" id="drawerCloseBtn">✕</button>
        </div>
        <div class="drawer-search">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="searchInput" placeholder="搜索地点/NPC/道具/Boss...">
        </div>
        <div class="chapter-list" id="chapterList">
          <!-- 动态分类章节 -->
        </div>
      </aside>

      <!-- 正文阅读容器 -->
      <div class="guide-viewport">
        <!-- 章节信息栏 -->
        <div class="reader-toolbar">
          <button class="drawer-trigger-btn" id="drawerTriggerBtn">
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="3" y1="12" x2="21" y2="12"/>
              <line x1="3" y1="6" x2="21" y2="6"/>
              <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            <span>目录</span>
          </button>

          <div class="chapter-heading" id="currentTitle" title="">
            P21 宁姆格福（西）-风暴关卡
          </div>

          <!-- 字号与页码 -->
          <div class="reader-actions">
            <button class="font-btn" id="fontDecBtn" title="缩小字号">A-</button>
            <button class="font-btn" id="fontIncBtn" title="放大字号">A+</button>
            <span class="page-counter" id="pageCounter">21/199</span>
          </div>
        </div>

        <!-- 关键收集速览横幅 (默认隐藏，有数据时才展开) -->
        <div class="highlights-banner" id="highlightsBanner" style="display: none;">
          <div class="hl-label">⚡ 本节关键收集速览:</div>
          <div class="hl-tags" id="hlTagsList">
            <!-- 动态生成高亮胶囊 -->
          </div>
        </div>

        <!-- 攻略图文正文 (独立流畅滚动) -->
        <article class="guide-article" id="guideArticle">
          <!-- 动态注入文章 -->
        </article>

        <!-- 底部固定翻页工具栏 -->
        <footer class="reader-footer">
          <button class="footer-nav-btn prev" id="prevBtn" title="快捷键: [ 或 Alt+←">
            <span>⬅️ 上一节</span>
          </button>
          <button class="footer-nav-btn center" id="footerChapterPicker">
            <span id="footerChapterText">P21 / 199</span>
          </button>
          <button class="footer-nav-btn next" id="nextBtn" title="快捷键: ] 或 Alt+→">
            <span>下一节 ➡️</span>
          </button>
        </footer>
      </div>
    </section>

    <!-- TAB 2: 全收集 & 支线防断追踪器 -->
    <section class="tab-pane" id="checklistPane">
      <div class="checklist-viewport" id="checklistContainer">
        <!-- 动态生成收集统计与支线节点 -->
      </div>
    </section>

    <!-- TAB 3: 互动大地图 -->
    <section class="tab-pane" id="mapPane">
      <div class="map-wrapper">
        <div class="map-tip-bar">
          <span>🗺️ 游民官方全收集互动地图（支持点位标记与缩放，与游戏进度配合使用）</span>
          <button class="map-reload-btn" id="mapReloadBtn">🔄 刷新地图</button>
        </div>
        <iframe class="map-frame" id="mapIframe" src="" loading="lazy"></iframe>
      </div>
    </section>

    <!-- TAB 4: 开荒避坑与等级速查 -->
    <section class="tab-pane" id="tipsPane">
      <div class="tips-viewport" id="tipsContainer">
        <!-- 动态生成区域等级对照与神器逃课指南 -->
      </div>
    </section>

  </main>

  <!-- 鼠标穿透激活状态浮动指示徽章 -->
  <div class="clickthrough-badge" id="clickthroughBadge">
    <div class="pulse-dot"></div>
    <span>鼠标穿透中 (点击直达游戏 | 按 Alt+Q 解除)</span>
  </div>

  <!-- 高清图片无损灯箱预览 Modal -->
  <div class="lightbox-modal" id="lightboxModal">
    <div class="lightbox-content">
      <img id="lightboxImg" src="" alt="高清大图">
      <div class="lightbox-close-hint">点击任意空白处关闭大图预览</div>
    </div>
  </div>

  <!-- 注入数据与交互脚本 -->
  <script src="/static/js/guide_data.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
